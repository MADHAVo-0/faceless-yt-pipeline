name: Daily Faceless YouTube Pipeline

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 6:00 AM IST
  workflow_dispatch: {}      # adds a "Run workflow" button for manual testing

jobs:
  run-channels:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1        # run one channel at a time to avoid git conflicts
      fail-fast: false
      matrix:
        channel: [geology, cosmology, facts, funny]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline for ${{ matrix.channel }}
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GEOLOGY_YT_REFRESH_TOKEN: ${{ secrets.GEOLOGY_YT_REFRESH_TOKEN }}
          COSMOLOGY_YT_REFRESH_TOKEN: ${{ secrets.COSMOLOGY_YT_REFRESH_TOKEN }}
          FACTS_YT_REFRESH_TOKEN: ${{ secrets.FACTS_YT_REFRESH_TOKEN }}
          FUNNY_YT_REFRESH_TOKEN: ${{ secrets.FUNNY_YT_REFRESH_TOKEN }}
        run: python run_channel.py ${{ matrix.channel }}

      - name: Save today's topic to history
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add data/used_topics.json
          git commit -m "Record topic used by ${{ matrix.channel }}" || echo "Nothing new to commit"
          git pull --rebase
          git push
